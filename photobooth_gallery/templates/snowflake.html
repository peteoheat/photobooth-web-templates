<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>{{TITLE}}</title>
  <style>
    /* Seasonal winter theme: always dark, falling snow, frosted cards. */
    :root {
      --bg: #071827;
      --bg-bottom: #08122a;
      --surface: #0b1a33;
      --text: #f3f8ff;
      --muted: rgba(243, 248, 255, .74);
      --line: rgba(255, 255, 255, .12);
      --accent: #9be7ff;
      --accent-text: #001827;
      --snow: #bfe6ff;
      --overlay: rgba(3, 9, 20, .93);
      --shadow: 0 8px 26px rgba(2, 8, 20, .7);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-bottom) 100%) fixed;
      background-color: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 16px 20px;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); line-height: 1.15; letter-spacing: -.02em; font-weight: 700; }
    .subtitle { margin: 8px 0 0; color: var(--muted); }
    .count { margin-top: 14px; display: inline-block; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
    main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 48px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
    .card {
      position: relative; display: block; width: 100%; padding: 0; border: 0; cursor: pointer;
      aspect-ratio: 1; overflow: hidden; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow);
    }
    .card img, .card video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
    .card:hover img, .card:hover video { transform: scale(1.04); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .card .badge {
      position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 2px 8px; pointer-events: none;
    }
    .card { border: 1px solid rgba(255, 255, 255, .06); }
    .card::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 30%; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0));
    }
    .card .badge { z-index: 2; }
    .card.is-new { animation: pop .5s ease; }

    /* falling snow */
    .snow { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
    .flake { position: absolute; top: 0; color: var(--snow); will-change: transform; animation: fall linear infinite; }
    @keyframes fall {
      0% { transform: translate(0, -10vh) rotate(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translate(30vw, 110vh) rotate(360deg); opacity: .85; }
    }
    @media (prefers-reduced-motion: reduce) { .snow { display: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
    .message { text-align: center; color: var(--muted); padding: 60px 0; }

    /* viewer */
    .viewer { position: fixed; inset: 0; z-index: 10; background: var(--overlay); display: none; color: #f4efe9; }
    .viewer.open { display: flex; flex-direction: column; }
    .viewer-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; gap: 8px; }
    .viewer-pos { font-size: 14px; opacity: .8; padding-left: 6px; }
    .viewer-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 24px; padding: 0 64px 16px; }
    .stage { min-width: 0; min-height: 0; max-height: 100%; display: flex; align-items: center; justify-content: center; flex: 0 1 auto; }
    .stage img, .stage video { max-width: 100%; max-height: calc(100vh - 110px); border-radius: 8px; display: block; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
    .side { width: 220px; flex: 0 0 220px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
    .qr { background: #fff; border-radius: 12px; padding: 10px; }
    .qr img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    .qr-hint { font-size: 13px; text-align: center; opacity: .85; margin: 0 0 4px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(255, 255, 255, .18); background: transparent; color: inherit;
      font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-text); }
    .btn:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 999px; border: 0; cursor: pointer; color: #fff;
      background: rgba(255, 255, 255, .1); font-size: 22px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, .2); }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); }
    .nav.prev { left: 12px; }
    .nav.next { right: 12px; }
    .nav[disabled] { opacity: .25; cursor: default; }
    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .viewer-body { flex-direction: column; justify-content: flex-start; padding: 0 16px 16px; overflow-y: auto; gap: 14px; }
      .stage { flex: 0 0 auto; width: 100%; }
      .stage img, .stage video { max-height: 62vh; }
      .side { width: 100%; max-width: 420px; flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
      .side .qr-block { display: flex; align-items: center; gap: 12px; width: 100%; }
      .qr { width: 120px; flex: 0 0 120px; padding: 6px; }
      .side .btn { flex: 1 1 140px; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <div class="snow" id="snow" aria-hidden="true"></div>
  <header>
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <span class="count" id="count" hidden></span>
  </header>

  <main>
    <div class="grid" id="grid" aria-live="polite"></div>
    <p class="message" id="message">Loading photos…</p>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="viewer-top">
      <span class="viewer-pos" id="pos"></span>
      <button class="icon-btn" id="close" aria-label="Close">&#x2715;</button>
    </div>
    <div class="viewer-body">
      <div class="stage" id="stage"></div>
      <div class="side">
        <div class="qr-block" id="qrBlock" hidden>
          <div class="qr"><img id="qrImg" alt="QR code to download this photo"></div>
          <p class="qr-hint">Scan with your phone to download this photo</p>
        </div>
        <a class="btn primary" id="download" download>Download</a>
        <a class="btn" id="shareLink" target="_blank" rel="noopener" hidden>Open download page</a>
        <button class="btn" id="share" type="button" hidden>Share…</button>
      </div>
    </div>
    <button class="icon-btn nav prev" id="prev" aria-label="Previous photo">&#x2039;</button>
    <button class="icon-btn nav next" id="next" aria-label="Next photo">&#x203A;</button>
  </div>

  <script>
    (function () {
      const MANIFEST = '{{MANIFEST}}';
      const POLL_SECONDS = Number('{{POLL_SECONDS}}') || 0;

      const $ = (id) => document.getElementById(id);
      const grid = $('grid'), message = $('message'), count = $('count');
      const viewer = $('viewer'), stage = $('stage'), pos = $('pos');
      const qrBlock = $('qrBlock'), qrImg = $('qrImg');
      const download = $('download'), shareLink = $('shareLink'), share = $('share');

      let items = [];            // newest first, as in the manifest
      const cards = new Map();   // key -> card element
      let current = -1;          // index of the item open in the viewer
      let loadedOnce = false;
      let lastText = '';
      let retryTimer = null;     // quick retry while the first load fails

      const keyOf = (it) => it.id || it.full;
      const versioned = (url, it) => (it.revision ? url + (url.includes('?') ? '&' : '?') + 'v=' + it.revision : url);
      const isVideo = (url) => /\.mp4(\?|#|$)/i.test(url || '');
      const nameOf = (it) => it.filename || (it.full || '').split('/').pop();

      function mediaEl(url, full) {
        if (isVideo(url)) {
          const v = document.createElement('video');
          v.src = url; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
          if (full) { v.controls = true; v.muted = false; }
          return v;
        }
        const img = document.createElement('img');
        img.src = url; img.alt = '';
        if (!full) { img.loading = 'lazy'; img.decoding = 'async'; }
        return img;
      }

      function makeCard(it) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.setAttribute('aria-label', 'Open photo ' + nameOf(it));
        card.appendChild(mediaEl(it.thumb, false));
        card.dataset.rev = String(it.revision || 0);
        card.addEventListener('click', () => open(items.findIndex((x) => keyOf(x) === keyOf(it))));
        return card;
      }

      function render(list) {
        const openKey = current >= 0 && items[current] ? keyOf(items[current]) : null;
        const keep = new Set();
        list.forEach((it, i) => {
          const k = keyOf(it);
          keep.add(k);
          let card = cards.get(k);
          if (card && card.dataset.rev !== String(it.revision || 0)) { card.remove(); card = null; }
          if (!card) {
            card = makeCard(it);
            if (loadedOnce) {
              card.classList.add('is-new');
              const badge = document.createElement('span');
              badge.className = 'badge'; badge.textContent = 'New';
              card.appendChild(badge);
            }
            cards.set(k, card);
          }
          if (grid.children[i] !== card) grid.insertBefore(card, grid.children[i] || null);
        });
        for (const [k, card] of cards) if (!keep.has(k)) { card.remove(); cards.delete(k); }

        items = list;
        loadedOnce = true;
        message.hidden = items.length > 0;
        message.textContent = 'No photos yet. They will appear here as soon as they are taken.';
        count.hidden = items.length === 0;
        count.textContent = items.length === 1 ? '1 photo' : items.length + ' photos';

        if (openKey !== null) {
          const idx = items.findIndex((x) => keyOf(x) === openKey);
          if (idx < 0) close(); else { current = idx; updateNav(); }
        }
      }

      async function load() {
        try {
          const res = await fetch(MANIFEST + '?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          if (text === lastText) return;
          lastText = text;
          const data = JSON.parse(text);
          render(Array.isArray(data) ? data.filter((x) => x && x.full && x.thumb) : []);
        } catch (err) {
          console.warn('gallery: could not load', MANIFEST, err);
          if (!loadedOnce) {
            message.textContent = 'The gallery could not be loaded yet. Retrying…';
            if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; load(); }, 2000);
          }
        }
      }

      function updateNav() {
        pos.textContent = (current + 1) + ' / ' + items.length;
        $('prev').disabled = current <= 0;
        $('next').disabled = current >= items.length - 1;
      }

      function open(index) {
        if (index < 0 || index >= items.length) return;
        const it = items[index];
        current = index;
        stage.replaceChildren(mediaEl(versioned(it.full, it), true));
        download.href = versioned(it.full, it);
        download.setAttribute('download', nameOf(it));

        qrBlock.hidden = !it.qrcode;
        if (it.qrcode) qrImg.src = it.qrcode;
        shareLink.hidden = !it.share_url;
        if (it.share_url) shareLink.href = it.share_url;

        share.hidden = !navigator.share;
        share.onclick = () => navigator.share({
          title: document.title,
          url: it.share_url || new URL(it.full, location.href).href,
        }).catch(() => {});

        updateNav();
        if (!viewer.classList.contains('open')) {
          viewer.classList.add('open');
          document.body.style.overflow = 'hidden';
          $('close').focus();
        }
      }

      function close() {
        if (!viewer.classList.contains('open')) return;
        viewer.classList.remove('open');
        document.body.style.overflow = '';
        stage.replaceChildren();
        const it = items[current];
        current = -1;
        if (it && cards.get(keyOf(it))) cards.get(keyOf(it)).focus();
      }

      $('close').addEventListener('click', close);
      $('prev').addEventListener('click', () => open(current - 1));
      $('next').addEventListener('click', () => open(current + 1));
      viewer.addEventListener('click', (e) => { if (e.target === viewer || e.target.classList.contains('viewer-body')) close(); });
      document.addEventListener('keydown', (e) => {
        if (!viewer.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') open(current - 1);
        else if (e.key === 'ArrowRight') open(current + 1);
      });

      let touchX = null;
      stage.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', (e) => {
        if (touchX === null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        touchX = null;
        if (Math.abs(dx) > 50) open(current + (dx < 0 ? 1 : -1));
      });

      (function snow(count) {
        const layer = $('snow'), symbols = ['❅', '❆', '❄'];
        for (let i = 0; i < count; i++) {
          const f = document.createElement('div');
          f.className = 'flake';
          f.textContent = symbols[i % symbols.length];
          f.style.left = (Math.random() * 100 - 20) + 'vw';
          f.style.fontSize = (8 + Math.random() * 18) + 'px';
          f.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
          f.style.animationDuration = (7 + Math.random() * 9) + 's';
          f.style.animationDelay = (-Math.random() * 12) + 's';
          layer.appendChild(f);
        }
      })(36);

      load();
      if (POLL_SECONDS > 0) {
        let timer = setInterval(load, POLL_SECONDS * 1000);
        document.addEventListener('visibilitychange', () => {
          clearInterval(timer);
          if (!document.hidden) { load(); timer = setInterval(load, POLL_SECONDS * 1000); }
        });
      }
    })();
  </script>
</body>
</html>
